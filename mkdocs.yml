site_name: Портфолио
site_description: Портфолио лабораторных работ
site_author: Зайцев Владимир Андреевич
site_url: https://GG-crypto34.github.io/
repo_url: https://github.com/GG-crypto34/gg-crypto34.github.io
repo_name: gg-crypto34.github.io
theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: white
      accent: green
  font:
    text: Inter
    code: Roboto Mono
  features:
    - navigation.top
    - navigation.sections
    - content.code.copy
    - search.highlight
    - search.suggest

nav:
  - Главная: index.md
  - Обо мне: about.md
  - Лабораторные: labs.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
