site_name: Портфолио лабораторных работ
site_description: Сайт-портфолио с лабораторными работами и проектами
site_author: Зайцев Владимир Андреевич
site_url: https://GG-crypto34.github.io/ИМЯ-РЕПОЗИТОРИЯ/

theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: white
      accent: green
  font:
    text: Inter
    code: Roboto Mono

nav:
  - Главная: index.md
  - Обо мне: about.md
  - Лабораторные работы: labs.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
