on:
  push:
    - workflows: [check-site]
      filter:
        branches: ["main"]

workflows:
  check-site:
    tasks:
      - check-task

tasks:
  - name: check-task
    cubes:
      - name: verify-static-site
        image: docker.io/library/alpine
        script:
          - test -f site/index.html
          - test -f site/assets/stylesheets/main.484c7ddc.min.css
          - echo "Static site is ready for SourceCraft Sites"
